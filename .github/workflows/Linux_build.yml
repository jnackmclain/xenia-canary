  create-release:
    name: Create release
    # Run on upstream canary_experimental, and ALSO on forks on the same branch.
    needs: [lint, build-clang] # , build-gcc
    if: |
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/heads/canary_experimental')
    uses: ./.github/workflows/Create_release.yml
    with:
      os: linux
    secrets:
      # Prefer a dedicated PAT if present; otherwise fall back to the repo's GITHUB_TOKEN,
      # which works for forks publishing releases in their own repo.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
